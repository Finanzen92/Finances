<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zinseszinsrechner | Smart Finance Tools</title>

  <!-- 📱 PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b, #334155);
      background-attachment: fixed;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .shell {
      width: 100%;
      max-width: 1200px;
      min-height: 720px;
      display: flex;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.9s ease;
    }

    .sidebar {
      width: 320px;
      background: linear-gradient(180deg, rgba(17,24,39,0.96), rgba(31,41,55,0.94));
      padding: 36px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-small {
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav a {
      display: block;
      text-decoration: none;
      color: #e5e7eb;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .nav a:hover {
      transform: translateX(6px) scale(1.02);
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      color: #ffffff;
    }

    .sidebar-footer {
      color: rgba(255,255,255,0.58);
      font-size: 13px;
      line-height: 1.5;
      margin-top: 32px;
    }

    .content {
      flex: 1;
      padding: 56px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(circle at top right, rgba(118,75,162,0.10), transparent 30%),
        radial-gradient(circle at bottom left, rgba(102,126,234,0.10), transparent 28%);
    }

    .calculator-card {
      width: 100%;
      max-width: 620px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 24px;
      padding: 28px;
      box-sizing: border-box;
      box-shadow: 0 18px 40px rgba(17,24,39,0.10);
      animation: fadeInText 1.1s ease;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 42px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #111827;
    }

    .subtitle {
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.88);
      color: #111827;
    }

    input:focus {
      outline: none;
      border-color: #475569;
      box-shadow: 0 0 0 4px rgba(71, 85, 105, 0.12);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .row button {
      flex: 1;
    }

    .result {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 700;
      white-space: pre-line;
      color: #111827;
      line-height: 1.7;
    }

    canvas {
      margin-top: 20px;
      width: 100% !important;
      height: auto !important;
    }

    /* 🌙 DARK MODE */
    .dark {
      background: #121212;
    }

    .dark .shell {
      background: rgba(30, 30, 30, 0.94);
    }

    .dark .content {
      background:
        radial-gradient(circle at top right, rgba(71,85,105,0.24), transparent 30%),
        radial-gradient(circle at bottom left, rgba(30,41,59,0.24), transparent 28%);
    }

    .dark .calculator-card {
      background: rgba(24, 24, 27, 0.84);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    }

    .dark h1,
    .dark .result {
      color: #f8fafc;
    }

    .dark .subtitle {
      color: #cbd5e1;
    }

    .dark input {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
        min-height: auto;
      }

      .sidebar {
        width: 100%;
      }

      .content {
        padding: 30px;
      }

      .calculator-card {
        max-width: 100%;
      }

      h1 {
        font-size: 34px;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 12px;
        align-items: flex-start;
      }

      .shell {
        min-height: auto;
        border-radius: 22px;
      }

      .sidebar {
        padding: 22px 16px;
      }

      .brand-small {
        margin-bottom: 14px;
      }

      .nav {
        gap: 10px;
      }

      .nav a {
        padding: 14px 16px;
        font-size: 14px;
        border-radius: 14px;
      }

      .sidebar-footer {
        margin-top: 24px;
        font-size: 12px;
      }

      .content {
        padding: 24px 18px 26px 18px;
      }

      .calculator-card {
        padding: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.12;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 18px;
      }

      input {
        font-size: 16px;
        padding: 14px;
      }

      button {
        font-size: 14px;
        padding: 14px;
      }

      .row {
        flex-direction: column;
      }

      .result {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="shell">
    <aside class="sidebar">
      <div>
        <div class="brand-small">Smart Finance Tools</div>

        <nav class="nav">
          <a href="budget-rechner.html">Budget-Rechner</a>
          <a href="finanzielle-freiheit-rechner.html">Finanzielle Freiheit Rechner</a>
          <a href="sparrechner.html">Sparrechner</a>
          <a href="zinseszinsrechner.html">Zinseszinsrechner</a>
        </nav>
      </div>

      <div class="sidebar-footer">
        Hochwertige Finanzrechner für fundierte Entscheidungen und klare Planung.
      </div>
    </aside>

    <main class="content">
      <div class="calculator-card">
        <h1>Zinseszinsrechner</h1>
        <div class="subtitle">
          Berechne die Entwicklung deines Vermögens mit Startkapital, monatlicher Einzahlung und optionaler Inflation.
        </div>

        <div class="input-group">
          <input type="number" id="kapital" placeholder="Startkapital (CHF)">
          <input type="number" id="zins" placeholder="Zinssatz (%)">
          <input type="number" id="jahre" placeholder="Laufzeit (Jahre)">
          <input type="number" id="sparrate" placeholder="Monatliche Einzahlung (CHF)">
          <input type="number" id="inflation" placeholder="Inflation (%) (optional)">
        </div>

        <button onclick="berechnen()">Berechnen</button>

        <div class="row">
          <button onclick="toggleDark()">🌙 Darkmode</button>
          <button onclick="downloadPDF()">📄 PDF</button>
        </div>

        <div class="result" id="ergebnis"></div>

        <canvas id="chart"></canvas>
      </div>
    </main>
  </div>
</div>

<script>
let chart;
let lastResult = "";
let lastLabels = [];
let lastData = [];

function berechnen() {
  let K0 = parseFloat(document.getElementById("kapital").value);
  let r = parseFloat(document.getElementById("zins").value) / 100;
  let years = parseInt(document.getElementById("jahre").value);
  let monthly = parseFloat(document.getElementById("sparrate").value) || 0;
  let inflation = parseFloat(document.getElementById("inflation").value) / 100 || 0;

  if (isNaN(K0) || isNaN(r) || isNaN(years)) {
    document.getElementById("ergebnis").innerText = "Bitte Pflichtfelder ausfüllen";
    return;
  }

  let balance = K0;
  let labels = [];
  let data = [];

  for (let y = 0; y <= years; y++) {
    labels.push("Jahr " + y);
    data.push(balance.toFixed(2));

    for (let m = 0; m < 12; m++) {
      balance = balance * (1 + r / 12) + monthly;
    }
  }

  let realValue = balance / Math.pow(1 + inflation, years);

  lastLabels = labels;
  lastData = data;

  lastResult =
    "Startkapital: " + K0.toFixed(2) + " CHF\n" +
    "Zinssatz: " + (r * 100).toFixed(2) + " %\n" +
    "Laufzeit: " + years + " Jahre\n" +
    "Monatliche Einzahlung: " + monthly.toFixed(2) + " CHF\n" +
    "Inflation: " + (inflation * 100).toFixed(2) + " %\n\n" +
    "Endkapital (nominal): " + balance.toFixed(2) + " CHF\n" +
    "Endkapital (real): " + realValue.toFixed(2) + " CHF";

  document.getElementById("ergebnis").innerText = lastResult;

  drawChart(labels, data);
}

function drawChart(labels, data) {
  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Vermögen (CHF)",
        data: data,
        borderColor: "#1e293b",
        backgroundColor: "rgba(30,41,59,0.18)",
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          display: true
        }
      }
    }
  });
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const now = new Date();
  const timestamp = now.toLocaleString();

  doc.setFontSize(9);
  doc.text(timestamp, 200, 10, { align: "right" });

  doc.setFontSize(16);
  doc.text("Zinseszins Report", 10, 20);

  doc.setFontSize(11);

  let lines = lastResult.split("\n");
  let y = 35;

  lines.forEach(line => {
    doc.text(line, 10, y);
    y += 7;
  });

  if (chart) {
    const imgData = document.getElementById("chart").toDataURL("image/png");
    doc.addImage(imgData, "PNG", 10, y + 5, 180, 90);
  }

  doc.save("zinseszins_report.pdf");
}
</script>

<!-- 📦 PWA Service Worker -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
